<h1>Adicionar Disciplina</h1>

<form method = "post">
    {% csrf_token %}
    <div>
        <label>Nome:</label>
        <input name = "nome">
    </div>

    <div>
        <label>Código:</label>
        <input name = "codigo">
    </div>


    <div>
        <label>Descrição:</label>
        <input name = "descricao">
    </div>
    
    <div>
        <label>Departamento:</label>
        <input name = "departamento">
    </div>
    
    <input type="submit" value="Adicionar">
</form>
