{% extends 'base.html' %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/flashcards.css' %}">


<header>
    <div>
        <h1>Flashcards</h1>
        <p>Crie decks por disciplina e revise com repetição espaçada inteligente.</p>
    </div>
    <button class="btn-criar-deck" onclick="abrirModal()">+ Criar Deck</button>
</header>


<div class="decks-container" id="decksContainer"></div>

<div class="modal-overlay" id="modalOverlay" onclick="fecharModal(event)">
    <div class="modal">
        <button class="modal-fechar" onclick="fecharModal()">✕</button>
        <h2>Novo Deck</h2>

        <label>Disciplina</label>
        <select id="selectDisciplina">
            <option value="">Selecione a disciplina</option>
            {% for disciplina in disciplinas %}
                <option value="{{ disciplina.id }}" data-codigo="{{ disciplina.codigo }}">{{ disciplina.nome }}</option>
            {% endfor %}
        </select>

        <label>Nome do Deck</label>
        <input type="text" id="inputNomeDeck" placeholder="Ex: Ponteiros e Memória">

        <button class="btn-criar-deck btn-modal" onclick="criarDeck()">Criar Deck</button>
    </div>
</div>

<script>
    function abrirModal() {
        document.getElementById('modalOverlay').classList.add('ativo');
    }

    function fecharModal(e) {
        if (!e || e.target === document.getElementById('modalOverlay')) {
            document.getElementById('modalOverlay').classList.remove('ativo');
        }
    }

    function criarDeck() {
        const select = document.getElementById('selectDisciplina');
        const input  = document.getElementById('inputNomeDeck');

        const nomeDeck        = input.value.trim();
        const opcao           = select.options[select.selectedIndex];
        const nomeDisciplina  = opcao.text;
        const codigoDisciplina = opcao.getAttribute('data-codigo');

        console.log('nome:', nomeDeck, '| codigo:', codigoDisciplina);

        if (!nomeDeck || !codigoDisciplina) {
            alert('Preencha todos os campos.');
            return;
        }

        const card = document.createElement('div');
        card.classList.add('deck-card');
        card.innerHTML = `
            <span class="deck-card-codigo">${codigoDisciplina}</span>
            <h3 class="deck-card-nome">${nomeDeck}</h3>
            <p class="deck-card-disciplina">${nomeDisciplina}</p>
        `;

        document.getElementById('decksContainer').appendChild(card);

        input.value = '';
        select.selectedIndex = 0;
        fecharModal();
    }
</script>


{% endblock %}
