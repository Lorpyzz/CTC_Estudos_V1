{% extends "base.html" %}
{% load static %}

{% block title %}Login{% endblock %}

{% block content %}
   <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
    <div class="login-box">
        <img src="imagens/logo-puc-rio.png" width="60px">
        <h2>Entrar no CTC Estudos</h2>
        <p>Use sua matrícula da PUC-Rio para acessar</p>

        <div class="campo">
            <label>Matrícula</label>
            <input type="text" placeholder="Ex: 2310000" required>
        </div>

        <div class="campo">
            <label>Senha</label>
            <input type="password" placeholder="••••••••" required>
        </div>

        <a href="index.html" class="btn-entrar">Entrar</a>
    </div>
</body>
{% endblock %}

</html>
