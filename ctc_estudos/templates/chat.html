{% extends "base.html" %}
{% load static %}
 
{% block content %}
 
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="{% static 'css/chat.css' %}">
 
<div class="app-container">
 
    <aside class="sidebar">
 
        <div class="sidebar-header">
            <h2>Conversas</h2>
            <button class="btn-plus" onclick="createNewChat()">+</button>
        </div>
 
        <div class="chat-list" id="chat-list">
 
            <div class="chat-item active" onclick="selectChat(this, 'Chat Geral', 'CG')">
                <div class="avatar light-blue">CG</div>
                <div class="chat-info">
                    <div class="chat-top"><strong>Chat Geral</strong></div>
                    <p class="preview">Chat principal</p>
                </div>
            </div>

        </div>
    </aside>

    <main class="chat-window">
 
        <header class="chat-header">
            <i class="fa-regular fa-comment"></i>
            <div class="avatar-small light-blue" id="header-avatar">CG</div>
            <h3 id="chat-title">Chat Geral</h3>
        </header>

        <!-- container com as msgs -->
        <div class="messages-container" id="messages-container">
            {% for msg in mensagens %}
                <div class="message-row sent">

                    <div class="avatar-small user-blue">{{ msg.usuario|first }}</div>
 
                    <div class="message-content">
                        <span class="sender-name">
                            {{ msg.usuario }}
                            <small>{{ msg.horario }}</small>
                        </span>
                        <div class="bubble">{{ msg.mensagem }}</div>
                    </div>
                </div>

            {% endfor %}
        </div>

        <div class="chat-input-area">
            <form method="POST" style="display:flex; width:100%; gap:10px;">  <!-- envia msg pro jango -->
                {% csrf_token %}
 
                <div class="input-actions">
                    <button type="button" class="icon-btn"><i class="fa-regular fa-image"></i></button>
                    <button type="button" class="icon-btn"><i class="fa-s olid fa-paperclip"></i></button>
                </div>
 
                <input type="text" name="mensagem" id="message-input" placeholder="Digite sua mensagem...">
 
                <button type="submit" class="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
            </form>
        </div>

    </main>
</div>
 
<script>

    function selectChat(element, name, initial) {
        document.querySelectorAll('.chat-item')
            .forEach(
                item => item.classList.remove('active')
            );

        element.classList.add('active');
        document.getElementById('chat-title').innerText = name;
        document.getElementById('header-avatar').innerText = initial;
    }

    function createNewChat() { 
        const chatList = document.getElementById('chat-list');
        const newChat = document.createElement('div');

        newChat.className = 'chat-item';
        newChat.onclick = function() {
            selectChat(this, 'Novo Chat', 'NC');

        };

        newChat.innerHTML = `
            <div class="avatar light-blue">NC</div>
            <div class="chat-info">
                <div class="chat-top"><strong>Novo Chat</strong></div>
                <p class="preview">Chat vazio</p>
            </div>
        `;
        chatList.prepend(newChat);
        newChat.click();
    }
</script>
{% endblock %}
