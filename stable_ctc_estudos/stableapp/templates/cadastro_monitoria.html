{% extends "base.html" %}

{% block content %}
<div class="main-container">
    <h1>Cadastrar Nova Monitoria</h1>
    
    <form method="POST">
        {% csrf_token %}
        
        <div class="campo">
            <label for="{{ form.monitor.id_for_label }}">Monitor</label>
            {{ form.monitor }}
        </div>
        
        <div class="campo">
            <label for="{{ form.disciplina.id_for_label }}">Disciplina</label>
            {{ form.disciplina }}
        </div>
        
        <div class="campo">
            <label for="{{ form.semestre_atuacao.id_for_label }}">Semestre de Atuação</label>
            {{ form.semestre_atuacao }}
        </div>
        
        <div class="campo">
            <label for="{{ form.dia_semana.id_for_label }}">Dia da Semana</label>
            {{ form.dia_semana }}
        </div>
        
        <div class="campo">
            <label for="{{ form.horario.id_for_label }}">Horário</label>
            {{ form.horario }}
        </div>
        
        <div class="campo">
            <label for="{{ form.online.id_for_label }}">Online</label>
            {{ form.online }}
        </div>
        
        <div class="campo">
            <label for="{{ form.sala.id_for_label }}">Sala</label>
            {{ form.sala }}
        </div>
        
        <div class="campo">
            <label for="{{ form.link_reuniao.id_for_label }}">Link da Reunião</label>
            {{ form.link_reuniao }}
        </div>
        
        <button type="submit" class="btn-publicar">
            Salvar Monitoria
        </button>
        
        <button type="submit" class="btn-publicar">Salvar Monitoria</button>
    </form>
</div>
{% endblock %}
